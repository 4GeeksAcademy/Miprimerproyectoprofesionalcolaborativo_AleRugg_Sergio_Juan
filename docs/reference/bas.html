<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plantilla del prototipo visual de Drôle de Monsieur.">
  <title>Drôle de Monsieur | Not from Paris Madame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tailwind.css">
</head>
<body class="flex min-h-screen flex-col bg-[#F7F5F0] font-['Archivo',sans-serif] text-black">
  <a href="#contenido" class="sr-only z-50 bg-black p-3 text-white focus:not-sr-only focus:absolute">
    Saltar al contenido
  </a>

  <!-- Repetir la cabecera en cada vista; enlazar el logo cuando exista Inicio. -->
  <header class="border-b border-[#DEDAD3]">
    <nav aria-label="Navegación principal" class="mx-auto flex max-w-[1440px] flex-wrap items-center justify-between gap-6 px-4 py-6 md:px-8">
      <p class="max-w-full font-['Libre_Baskerville',serif] text-xl sm:text-2xl">Drôle de Monsieur</p>

      <!-- La búsqueda no procesa ni envía datos en este prototipo. -->
      <div role="search" aria-label="Búsqueda de productos" class="order-last w-full md:order-none md:ml-auto md:w-72">
        <label for="busqueda" class="mb-2 block text-sm">Buscar productos (demostración)</label>
        <input id="busqueda" type="search" disabled placeholder="Buscar"
          class="min-h-11 w-full rounded-none border border-[#DEDAD3] bg-transparent px-3 text-base disabled:cursor-not-allowed disabled:text-neutral-600 disabled:opacity-75">
      </div>

      <details class="w-full sm:w-auto md:max-w-56">
        <summary class="min-h-11 cursor-pointer py-3 text-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#6F263D]">Cuenta</summary>
        <p class="max-w-56 pb-3 text-sm text-neutral-700">Cuenta de demostración, sin acceso real.</p>
      </details>
    </nav>
  </header>

  <!-- Añadir el contenido y un único h1 al copiar la plantilla a una vista. -->
  <main id="contenido" tabindex="-1" class="mx-auto min-h-[40vh] w-full max-w-[1440px] flex-1 px-4 py-8 md:px-8 md:py-12"></main>

  <!-- Mantener el footer consistente; añadir enlaces solo cuando existan destinos. -->
  <footer class="border-t border-[#DEDAD3] bg-[#EFE5D2]">
    <div class="mx-auto grid max-w-[1440px] gap-10 px-4 py-10 sm:grid-cols-2 md:px-8 lg:grid-cols-3">
      <section aria-labelledby="categorias">
        <h2 id="categorias" class="mb-4 font-['Libre_Baskerville',serif] text-lg">Categorías</h2>
        <ul class="space-y-3 text-sm">
          <li>Calzado</li>
          <li>Camisas</li>
          <li>Pantalones</li>
          <li>Accesorios</li>
        </ul>
      </section>
      <section aria-labelledby="legal">
        <h2 id="legal" class="mb-4 font-['Libre_Baskerville',serif] text-lg">Legal</h2>
        <ul class="space-y-3 text-sm">
          <li>Términos y condiciones</li>
          <li>Política de privacidad</li>
          <li>Sobre la marca</li>
        </ul>
      </section>
      <section aria-labelledby="contacto">
        <h2 id="contacto" class="mb-4 font-['Libre_Baskerville',serif] text-lg">Contacto</h2>
        <p class="text-sm">Drôle de Monsieur · Francia</p>
        <p class="mt-6 font-['Libre_Baskerville',serif] text-sm uppercase leading-relaxed text-[#6F263D]">Not from Paris Madame</p>
      </section>
    </div>
  </footer>
</body>
</html>
